backend:
  name: git-gateway
  branch: main

site_url: https://ramosarizpealdia.com
display_url: https://ramosarizpealdia.com

media_folder: uploads
public_folder: /uploads

publish_mode: simple

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: noticias
    label: Noticias
    label_singular: Noticia
    folder: content/noticias
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    fields:
      - label: Título
        name: title
        widget: string
      - label: Subtítulo / Bajada
        name: summary
        widget: text
        required: false
      - label: Sección principal
        name: category
        widget: select
        hint: "Elige la sección principal. Esta definirá la URL y la etiqueta principal de la nota."
        options:
          - México
          - Coahuila
          - Ramos Arizpe
          - Saltillo
          - Región Sureste
          - Política
          - Seguridad
          - Economía
          - Estados
          - Mundo
          - Opinión
      - label: Mostrar también en
        name: sections
        widget: select
        multiple: true
        required: false
        hint: "Opcional. Puedes elegir una o varias secciones adicionales para que la misma nota aparezca también ahí."
        options:
          - México
          - Coahuila
          - Ramos Arizpe
          - Saltillo
          - Región Sureste
          - Política
          - Seguridad
          - Economía
          - Estados
          - Mundo
          - Opinión
      - label: Autor
        name: author
        widget: string
        default: "Ramos Arizpe al Día"
      - label: Fecha y hora
        name: date
        widget: datetime
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        picker_utc: false
        hint: "Usa la fecha y hora de Ramos Arizpe al momento de publicar."
      - label: Imagen principal
        name: image
        widget: image
        required: false
      - label: Destacar en portada
        name: featured
        widget: boolean
        default: false
      - label: Contenido de la nota
        name: body
        widget: markdown
